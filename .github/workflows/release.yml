name: Build & Release APK

on:
  push:
    tags: [ 'v*' ]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.2.3+4)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          # Keep Android SDK — Flutter needs it. Drop the rest.
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          tool-cache: false

      - uses: actions/checkout@v4

      - name: Show free disk
        run: df -h

      - name: Require tag to match pubspec.yaml
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            TAG="${TAG#v}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi

          PUBSPEC=$(awk '/^version:/{print $2; exit}' pubspec.yaml)

          if [ -z "$TAG" ] || [ -z "$PUBSPEC" ]; then
            echo "Could not read tag or pubspec version."
            exit 1
          fi

          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Git tag v${TAG} does not match pubspec.yaml version ${PUBSPEC}."
            echo "The APK is stamped from pubspec. Tagging an old commit publishes the old version under a new name."
            echo "Move the tag to the commit that actually contains ${TAG}."
            exit 1
          fi

          BUILD_NAME="${TAG%%+*}"
          BUILD_NUMBER="${TAG##*+}"

          if [ "$BUILD_NAME" = "$BUILD_NUMBER" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH+BUILD (got v${TAG})."
            exit 1
          fi

          echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "Stamping APK as ${BUILD_NAME}+${BUILD_NUMBER}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Local gradle.properties requests 8G heap + OOM dumps — too heavy for
      # GHA (fills the disk mid-assembleRelease). Use a leaner CI profile.
      - name: CI Gradle memory profile
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF

      - run: flutter pub get

      # koma-core (KRE) runs prost-build; cargokit compiles it during the APK.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - run: flutter build apk --release --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }}

      - name: Verify APK version
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAPT=$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}" -name aapt -type f 2>/dev/null | head -1 || true)

          if [ -z "$AAPT" ]; then
            echo "aapt not found; relying on --build-name/--build-number"
            exit 0
          fi

          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | head -n 3
          echo "$BADGING" | grep -F "versionName='${BUILD_NAME}'"
          echo "$BADGING" | grep -E "versionCode='${BUILD_NUMBER}'"

      - name: Name APK with version
        run: |
          cp "build/app/outputs/flutter-apk/app-release.apk" \
            "build/app/outputs/flutter-apk/koma-${BUILD_NAME}+${BUILD_NUMBER}.apk"

      - name: Show free disk after build
        if: always()
        run: df -h

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/koma-${{ env.BUILD_NAME }}+${{ env.BUILD_NUMBER }}.apk