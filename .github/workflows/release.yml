name: Build & Release APK

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          # Keep Android SDK — Flutter needs it. Drop the rest.
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          tool-cache: false

      - uses: actions/checkout@v4

      - name: Show free disk
        run: df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Local gradle.properties requests 8G heap + OOM dumps — too heavy for
      # GHA (fills the disk mid-assembleRelease). Use a leaner CI profile.
      - name: CI Gradle memory profile
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF

      - run: flutter pub get

      - name: Patch legacy plugin manifests for AGP 8.11
        run: |
          find "$HOME/.pub-cache" -path "*/flutter_native_splash-*/android/src/main/AndroidManifest.xml" -print -exec sed -i 's/ package="[^"]*"//' {} \;

      - run: flutter build apk --release

      - name: Show free disk after build
        if: always()
        run: df -h

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
