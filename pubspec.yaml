name: koma
description: "A hybrid reader + knowledge snippet manager."
publish_to: 'none'
version: 2.19.12+142

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  scrollable_positioned_list: ^0.3.8
  cupertino_icons: ^1.0.8
  # Data layer (Isar — Drift retired, see PHASE 11).
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.5
  path: ^1.9.1
  epubx: ^4.0.0
  http: ^1.3.0
  html: ^0.15.5
  file_picker: ^11.0.2
  shared_preferences: ^2.5.3
  # State: Riverpod (migrated off Provider in PHASE 2).
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  encrypt: ^5.0.3
  collection: ^1.19.1
  flutter_markdown: ^0.7.6
  google_fonts: ^8.1.0
  kindle_unpack: ^0.1.1
  flutter_native_splash: ^2.2.16
  flutter_launcher_icons: ^0.9.3
  flutter_tts: ^4.2.5
  just_audio: ^0.9.43
  # Routing (replacing raw Navigator.push — see PHASE 3).
  go_router: ^17.3.0
  # Image viewer + cover disk cache (see PHASE 5 + PHASE 6).
  extended_image: ^10.0.1
  # JS extension runtime (see PHASE 9).
  flutter_qjs:
    git:
      url: https://github.com/kodjodevf/flutter_qjs.git
      ref: main
  # Native C++ build hook (PHASE 5 spike — verifies native_toolchain_c works
  # on our pinned JDK 25 / AGP 8.7.3 toolchain before the full
  # subsampling_scale_image_view port).
  code_assets: ^1.2.1
  hooks: ^2.0.2
  native_toolchain_c: ^0.19.2
  ffi: ^2.1.5
  # Immutable model classes for Isar/riverpod models (mangayomi parity).
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  isar_community_generator:
    git:
      url: https://github.com/kodjodevf/isar-community-generator.git
      ref: v3
  freezed: ^3.2.3

flutter:
  uses-material-design: true
  assets:
    - app_icons/

flutter_icons:
  android: "launcher_icon"
  image_path: "app_icons/hon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  image: "app_icons/hon_black.png"
  fullscreen: true
  android: true
  android_gravity: center
